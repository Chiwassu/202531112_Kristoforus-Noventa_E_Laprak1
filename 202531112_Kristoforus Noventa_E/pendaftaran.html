<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Laporan Praktikum - Pendaftaran</title>
        <nav>
            <ul style="display: flex; justify-content: center; gap: 5px; list-style-type: none;">
                <li><a href="index.html">Beranda |</a></li>
                <li><a href="pendaftaran.html">Pendaftaran</a></li>
            </ul>
        </nav>
        <hr/>
    </head>

    <body>
        <h2>Form Pendaftaran Praktikan</h2>

        <table border="0" cellpadding="7" cellspacing="0">
            <form action="" method="post">
                <tr>
                    <td>Nama Lengkap</td>
                    <td>: <input type="text" name="nama" placeholder="Masukkan nama lengkap"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>: <input type="password" name="pass" placeholder="Masukkan password"></td>
                </tr>
                <tr>
                    <td>NIM</td>
                    <td>: <input type="number" name="nim" value="nim" placeholder="Masukkan NIM"></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>: <input type="date" name="tgl" value="tanggal_lahir"></td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:
                        <input type="radio" name="jk" value="L">Laki-laki
                        <input type="radio" name="jk" value="P">Perempuan
                    </td>
                </tr>
                <tr>
                    <td>Minat Bidang</td>
                    <td>:
                        <input type="checkbox" name="minat" value="web">Web
                        <input type="checkbox" name="minat" value="network">Jaringan
                        <input type="checkbox" name="minat" value="design">Design/Modelling
                    </td>
                </tr>
                <tr>
                    <td>Program Studi</td>
                    <td>:
                        <select name="prodi">
                            <option value="">Pilih Program Studi</option>
                            <option value="IF">Teknik Informatika</option>
                            <option value="SI">Sistem Informasi</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Alasan Mendaftar</td>
                    <td>: <textarea name="alasan" rows="3" cols="20"></textarea></td>
                </tr>
                <tr>
                    <td></td>
                    <td colspan="2">
                        <input type="submit" value="Kirim" style="margin-right: 5px;">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </form>
        </table>
    </body>
</html>
